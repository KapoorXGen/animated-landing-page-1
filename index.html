  <head>

    <title>Image Flip Animation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="hero">

      </div>

      <div class="images-container">
        <div class="img"><img src="/work-24.jpg" /></div>
        <div class="img"><img src="/work-6.jpg" /></div>
        <div class="img"><img src="/work-7.jpg" /></div>
        <div class="img"><img src="/work-8.jpg" /></div>
        <div class="img"><img src="/work-9.jpg" /></div>
        <div class="img"><img src="/work-10.jpg" /></div>
        <div class="img"><img src="/work-13.jpg" /></div>
        <div class="img"><img src="/work-14.jpg" /></div>
        <div class="img"><img src="/work-16.jpg" /></div>
        <div class="img"><img src="/work-19.jpg" /></div>
        <div class="img"><img src="/work-5.jpg" /></div>
        <div class="img"><img src="/work-6.jpg" /></div>
        <div class="img"><img src="/work-8.jpg" /></div>
        <div class="img"><img src="/work-10.jpg" /></div>
        <div class="img"><img src="/work-24.jpg" /></div>
      </div>

      <nav>
        <div class="logo-name"><a href="#">kapoor.</a></div>

        <div class="nav-items">
          <div class="links">
            <a href="#">Portfolio</a>
            <a href="#">/</a>
            <a href="#">About</a>
          </div>

          <div class="cta"><a href="#">Contact us</a></div>
        </div>
        <div class="divider"></div>
      </nav>

      <div class="sidebar">
        <div class="logo">
          <img src="public/logo.png" alt="Kapoor logo" />
        </div>
        <div class="divider"></div>
      </div>

      <header class="header">
        <h1>Visual engineering for modern brands</h1>
      </header>

      <div class="site-info">
        <h2>A design team focused on brands website, apps and products</h2>
        <div class="divider"></div>
        <div class="site-info-copy">
          <p>Award-winning creative studio</p>
          <p>Operating since 2019</p>
        </div>
      </div>

      <div class="hero-footer">
        <h2>watch showreel</h2>
      </div>

      <p class="disclaimer">
        Experimental GSAP animation demo (non-production).
      </p>
    </section>
    <script type="module" src="script.js"></script>
